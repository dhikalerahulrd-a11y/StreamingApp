apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamingapp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamingapp-frontend
  template:
    metadata:
      labels:
        app: streamingapp-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.services.frontend.image.repository }}:{{ .Values.services.frontend.image.tag }}"
          imagePullPolicy: "{{ .Values.services.frontend.image.pullPolicy }}"
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app: streamingapp-frontend
  ports:
    - port: 80
      targetPort: 80
