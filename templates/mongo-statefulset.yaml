apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongo
  labels:
    app: mongo

spec:
  serviceName: mongo
  replicas: {{ .Values.mongo.replicas }}

  selector:
    matchLabels:
      app: mongo

  template:
    metadata:
      labels:
        app: mongo

    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image }}"
          imagePullPolicy: {{ .Values.mongo.imagePullPolicy }}

          ports:
            - name: mongo
              containerPort: {{ .Values.mongo.port }}
              protocol: TCP

          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db

  volumeClaimTemplates:
    - metadata:
        name: mongo-storage

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: gp2

        resources:
          requests:
            storage: {{ .Values.mongo.storageSize }}

        volumeMode: Filesystem

  updateStrategy:
    type: RollingUpdate